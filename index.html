<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@400..800&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @theme{
            /* colors */
            --color-black:#0B0C10;
            --color-blue:#5B8DF8;
            --color-dark:#6B7280;
            --color-white:#F0F0F2;

            /* fonts */
            --font-syne: "syne", sans-serif;
            --font-dm-sans:"DM Sans",sans-serif;
        }
    </style>
</head>

<body class="bg-black text-white">
    <main class="py-[48px] lg:px-[90px]">
        <div class="mx-[24px] md:flex items-end justify-between">
            <div>
                <h1 class="font-syne font-extrabold text-white text-[44.8px] leading-[44.8px] tracking-[-1.5px] text-nowrap">
                    Task<span class="text-[#4f46e5]">Flow</span> 
                </h1>
                <h5 class="pt-[3px] font-dm-sans text-gray-500 text-[13px] leading-[20.8px] tracking-[1.04px] uppercase">
                    TEAM TASK MANAGEMENT
                </h5>
            </div>
            <div class="mt-[16px] flex gap-[24px]">
                <div>
                    <span id="header-total-count" class="ml-[25px] font-bold">0</span>
                    <p class="uppercase text-gray font-dm-sans text-[11px] leading-[17.6px] tracking-[0.66px] text-dark">
                        Total
                    </p>
                </div>
                <div>
                    <span id="header-done-count" class="ml-[25px] font-bold">0</span>
                    <p class="uppercase text-gray font-dm-sans text-[11px] leading-[17.6px] tracking-[0.66px] text-dark">
                        Done
                    </p>
                </div>
            </div>
        </div>

        <div class="mx-[24px] mt-[40px] max-w-full lg:max-w-[1200px] bg-[#121318] border border-[#20212b] rounded-[16px] p-[24px]">
            <h2 class="font-dm-sans font-bold text-[#6B7280] tracking-[1.5px] text-[12px] uppercase mb-[20px]">
                New Task
            </h2>

            <div class="grid grid-cols-2 md:flex md:items-center gap-[16px]">
                <input id="task-title" type="text" placeholder="Task title..." class="w-full bg-[#1a1b23] border border-[#2a2b36] rounded-[12px] px-[16px] py-[12px] text-white font-dm-sans text-[14px] outline-none focus:border-blue placeholder-[#6B7280] transition-colors md:flex-1">

                <input id="task-assignee" type="text" placeholder="Assigned to..." class="w-full bg-[#1a1b23] border border-[#2a2b36] rounded-[12px] px-[16px] py-[12px] text-white font-dm-sans text-[14px] outline-none focus:border-blue placeholder-[#6B7280] transition-colors md:flex-1">

                <div class="relative w-full md:w-[150px] lg:flex-1">
                    <select id="task-status" class="w-full bg-[#1a1b23] border border-[#2a2b36] rounded-[12px] px-[16px] py-[12px] text-white font-dm-sans text-[14px] outline-none appearance-none focus:border-blue transition-colors cursor-pointer pr-[40px]">
                        <option value="To Do">To Do</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Done">Done</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-[16px]">
                        <img src="/assets/Vector.png" alt="arrow" class="w-3 h-3">
                    </div>
                </div>

                <div class="relative w-full md:w-[130px] lg:flex-1">
                    <select id="task-priority" class="w-full bg-[#1a1b23] border border-[#2a2b36] rounded-[12px] px-[16px] py-[12px] text-white font-dm-sans text-[14px] outline-none appearance-none focus:border-blue transition-colors cursor-pointer pr-[40px]">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-[16px]">
                        <img src="/assets/Vector.png" alt="arrow" class="w-3 h-3">
                    </div>
                </div>

                <button id="add-task-btn" class="col-span-2 w-full md:w-auto md:px-[32px] bg-blue text-white font-dm-sans font-medium text-[15px] rounded-[12px] py-[12px] hover:opacity-90 transition-opacity cursor-pointer whitespace-nowrap">
                    + Add
                </button>
            </div>
        </div>

        <div class="mx-[24px] mt-[32px] grid grid-cols-1 lg:grid-cols-3 gap-[24px] items-start">
            <div class="w-full bg-[#121318] border border-[#20212b] rounded-[16px] p-[24px] flex flex-col min-h-[400px]">
                <div class="flex items-center justify-between mb-[24px]">
                    <h3 class="font-dm-sans font-bold text-[#3b82f6] text-[16px] tracking-[1px] uppercase">To Do</h3>
                    <span id="todo-count" class="w-[24px] h-[24px] bg-[#1a1b23] border border-[#2a2b36] rounded-full flex items-center justify-center font-dm-sans text-[12px] font-bold text-[#3b82f6]">0</span>
                </div>
                <hr class="border-[#20212b] mb-[24px]">
                <div id="todo-container" class="flex-1 flex flex-col gap-[16px]"></div>
            </div>

            <div class="w-full bg-[#121318] border border-[#20212b] rounded-[16px] p-[24px] flex flex-col min-h-[400px]">
                <div class="flex items-center justify-between mb-[24px]">
                    <h3 class="font-dm-sans font-bold text-[#fbbf24] text-[16px] tracking-[1px] uppercase">In Progress</h3>
                    <span id="inprogress-count" class="w-[24px] h-[24px] bg-[#1a1b23] border border-[#2a2b36] rounded-full flex items-center justify-center font-dm-sans text-[12px] font-bold text-[#fbbf24]">0</span>
                </div>
                <hr class="border-[#20212b] mb-[24px]">
                <div id="inprogress-container" class="flex-1 flex flex-col gap-[16px]"></div>
            </div>

            <div class="w-full bg-[#121318] border border-[#20212b] rounded-[16px] p-[24px] flex flex-col min-h-[400px]">
                <div class="flex items-center justify-between mb-[24px]">
                    <h3 class="font-dm-sans font-bold text-[#10b981] text-[16px] tracking-[1px] uppercase">Done</h3>
                    <span id="done-count" class="w-[24px] h-[24px] bg-[#1a1b23] border border-[#2a2b36] rounded-full flex items-center justify-center font-dm-sans text-[12px] font-bold text-[#10b981]">0</span>
                </div>
                <hr class="border-[#20212b] mb-[24px]">
                <div id="done-container" class="flex-1 flex flex-col gap-[16px]"></div>
            </div>
        </div>
    </main>
</body>
</html>
