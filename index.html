<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@400..800&display=swap"
        rel="stylesheet">
    <style type="text/tailwindcss">
        @theme{
            /* Design System Colors */
            
            /* Backgrounds */
            --color-bg-base: #0B0C10;
            --color-bg-surface: #121318;
            --color-bg-element: #1a1b23;
            
            /* Borders */
            --color-border-subtle: #20212b;
            --color-border-strong: #2a2b36;
            
            /* Text */
            --color-text-main: #F0F0F2;
            --color-text-muted: #6B7280;
            --color-text-light: #9CA3AF;
            
            /* Brand */
            --color-brand: #5B8DF8;
            --color-brand-dark: #4f46e5;
            
            /* Status */
            --color-status-todo: #3b82f6;
            --color-status-progress: #fbbf24;
            --color-status-done: #10b981;
            --color-status-danger: #ef4444;

            /* Fonts */
            --font-syne: "syne", sans-serif;
            --font-dm-sans: "DM Sans", sans-serif;
        }
    </style>
</head>

<body class="bg-bg-base text-text-main">
    <main class="py-[48px] lg:px-[90px]">

<!---Task Flow----------------------------------------------------------------->
        <div class="mx-[24px] md:flex items-end justify-between">
            <div>

                <h1
                    class="font-syne font-extrabold text-text-main text-[44.8px] leading-[44.8px] tracking-[-1.5px] text-nowrap">
                    Task<span class="text-brand-dark">Flow</span> </h1>
                <h5
                    class="pt-[3px] font-dm-sans text-text-muted text-[13px] leading-[20.8px] tracking-[1.04px] uppercase">
                    TEAM TASK MANAGEMENT
                </h5>

            </div>
            <div class="mt-[16px] flex gap-[24px]">

                <div>
                    <span id="header-total-count" class="ml-[25px] font-syne font-bold text-[32px] text-text-main ">0</span>
                    <p
                        class="uppercase font-dm-sans text-[11px] leading-[17.6px] tracking-[0.66px] text-text-muted">
                        Total</p>
                </div>
                <div>
                    <span id="header-total-count" class="ml-[25px] font-syne font-bold text-[32px] text-text-main ">1</span>
                    <p
                        class="uppercase font-dm-sans text-[11px] leading-[17.6px] tracking-[0.66px] text-text-muted">
                        Done</p>
                </div>

            </div>
        </div>



<!---Task Board----------------------------------------------------------------->


        <div
            class="mx-[24px] mt-[40px] bg-bg-surface border border-border-subtle rounded-[16px] p-[24px]">

            <h2 class="font-dm-sans font-bold text-text-muted tracking-[1.5px] text-[12px] uppercase mb-[20px]">
                New Task
            </h2>

            <div class="grid grid-cols-2 md:flex md:items-center gap-[16px]">

                <input type="text" placeholder="Task title..."
                    class="w-full bg-bg-element border border-border-strong rounded-[12px] px-[16px] py-[12px] text-text-main font-dm-sans text-[14px] outline-none focus:border-brand placeholder-text-muted transition-colors md:flex-1">
                <input type="text" placeholder="Assigned to..."
                    class="w-full bg-bg-element border border-border-strong rounded-[12px] px-[16px] py-[12px] text-text-main font-dm-sans text-[14px] outline-none focus:border-brand placeholder-text-muted transition-colors md:flex-1">

                <div class="relative w-full md:w-[150px] lg:flex-1">
                    <select
                        class="w-full bg-bg-element border border-border-strong rounded-[12px] px-[16px] py-[12px] text-text-main font-dm-sans text-[14px] outline-none appearance-none focus:border-brand transition-colors cursor-pointer pr-[40px]">
                        <option>To Do</option>
                        <option>In Progress</option>
                        <option>Done</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-[16px]">
                        <img src="assets/Vector.png" alt="">
                    </div>
                </div>

                <div class="relative w-full md:w-[130px] lg:flex-1">
                    <select
                        class="w-full bg-bg-element border border-border-strong rounded-[12px] px-[16px] py-[12px] text-text-main font-dm-sans text-[14px] outline-none appearance-none focus:border-brand transition-colors cursor-pointer pr-[40px]">
                        <option>Low</option>
                        <option>Medium</option>
                        <option>High</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-[16px]">
                        <img src="assets/Vector.png" alt="">
                    </div>
                </div>

                <button
                    class="col-span-2 w-full md:w-auto md:px-[32px] bg-brand text-text-main font-dm-sans font-medium text-[15px] rounded-[12px] py-[12px] hover:opacity-90 transition-opacity cursor-pointer whitespace-nowrap">
                    + Add
                </button>

            </div>
        </div>

        <div class="mx-[24px] mt-[32px] grid grid-cols-1 lg:grid-cols-3 gap-[24px] items-start">


<!---To Do----------------------------------------------------------------->
            <div class="w-full bg-bg-surface border border-border-subtle rounded-[16px] p-[24px] flex flex-col min-h-[400px]">

                <div class="flex items-center justify-between mb-[24px]">
                    <h3 class="font-dm-sans font-bold text-status-todo text-[16px] tracking-[1px] uppercase">To Do</h3>
                    <span id="todo-count"
                        class="w-[24px] h-[24px] bg-bg-element border border-border-strong rounded-full flex items-center justify-center font-dm-sans text-[12px] font-bold text-status-todo">0</span>
                </div>

                <hr class="border-border-subtle mb-[24px]">

                <div id="todo-container" class="flex-1 flex flex-col gap-[16px]">
                    <div class="flex-1 flex flex-col items-center justify-center py-[40px] text-text-muted h-full">
                        <div
                            class="w-[48px] h-[48px] border-2 border-dashed border-border-strong rounded-[12px] flex items-center justify-center mb-[12px]">
                            <img src="assets/union-1.png" alt="empty">
                        </div>
                        <p class="font-dm-sans text-[14px] text-text-muted">Empty</p>
                    </div>
                </div>
            </div>

<!---In Progress----------------------------------------------------------------->
            <div class="w-full bg-bg-surface border border-border-subtle rounded-[16px] p-[24px] flex flex-col min-h-[400px]">

                <div class="flex items-center justify-between mb-[24px]">
                    <h3 class="font-dm-sans font-bold text-status-progress text-[16px] tracking-[1px] uppercase">In Progress
                    </h3>
                    <span id="inprogress-count"
                        class="w-[24px] h-[24px] bg-bg-element border border-border-strong rounded-full flex items-center justify-center font-dm-sans text-[12px] font-bold text-status-progress">1</span>
                </div>

                <hr class="border-border-subtle mb-[24px]">

                <div id="inprogress-container" class="flex-1 flex flex-col gap-[16px]">


<!-----in progress card--------------------------------------------------------------->
                    <div class="bg-bg-element border border-border-strong rounded-[14px] p-[16px] flex flex-col gap-[16px]">

                        <h4 class="font-dm-sans font-medium text-text-main text-[16px]">Refine Design System</h4>

                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-[8px]">
                                <span
                                    class="w-[24px] h-[24px] bg-border-strong rounded-full flex items-center justify-center text-[11px] font-bold text-text-light">A</span>
                                <span class="font-dm-sans text-[13px] text-text-muted">Alex</span>
                            </div>
                            <span
                                class="bg-status-progress/10 border border-status-progress/20 text-status-progress font-dm-sans font-bold text-[11px] tracking-[0.5px] uppercase px-[10px] py-[4px] rounded-full">Medium</span>
                        </div>

                        <hr class="border-border-strong">

                        <div class="flex items-center gap-[12px]">

                            <div class="relative flex-1">
                                <select
                                    class="w-full bg-bg-surface border border-border-strong rounded-[8px] px-[12px] py-[8px] text-text-main font-dm-sans text-[13px] outline-none appearance-none cursor-pointer pr-[32px]">
                                    <option>To Do</option>
                                    <option selected>In Progress</option>
                                    <option>Done</option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-[10px]">
                                    <img src="assets/Vector.png" alt="">
                                </div>
                            </div>

                            <button
                                class="p-[8px] border border-border-strong rounded-[8px] hover:bg-border-subtle text-text-light transition-colors cursor-pointer flex items-center justify-center">
                                <img src="assets/icon (1).png" alt="">
                            </button>
                            <button class=" p-[8px] border border-border-strong rounded-[8px] hover:bg-status-danger/20 text-status-danger
                                    transition-colors cursor-pointer flex items-center justify-center">
                                <img src="assets/icon.png" alt="">
                            </button>

                        </div>
                    </div>

                </div>
            </div>

<!---Done----------------------------------------------------------------->
            <div class="w-full bg-bg-surface border border-border-subtle rounded-[16px] p-[24px] flex flex-col min-h-[400px]">

                <div class="flex items-center justify-between mb-[24px]">
                    <h3 class="font-dm-sans font-bold text-status-done text-[16px] tracking-[1px] uppercase">Done</h3>
                    <span id="done-count"
                        class="w-[24px] h-[24px] bg-bg-element border border-border-strong rounded-full flex items-center justify-center font-dm-sans text-[12px] font-bold text-status-done">0</span>
                </div>

                <hr class="border-border-subtle mb-[24px]">

                <div id="done-container" class="flex-1 flex flex-col gap-[16px]">
                    <div class="flex-1 flex flex-col items-center justify-center py-[40px] text-text-muted h-full">
                        <div
                            class="w-[48px] h-[48px] border-2 border-dashed border-border-strong rounded-[12px] flex items-center justify-center mb-[12px]">
                            <img src="assets/union-1.png" alt="empty" class="w-6 h-6 opacity-50">
                        </div>
                        <p class="font-dm-sans text-[14px] text-text-muted">Empty</p>
                    </div>
                </div>
                
            </div>

        </div>
    </main>
</body>
</html>
